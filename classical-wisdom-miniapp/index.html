<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <title>古今智慧 V1 · 远程预览</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app">
    <header class="hero">
      <div class="eyebrow">CLASSICAL WISDOM · V1 REMOTE PREVIEW</div>
      <h1>古今智慧</h1>
      <p>同一个问题，看看《周易》和亚里士多德怎么想。</p>
      <div class="status"><span>64卦</span><span>8卦深度注解</span><span>22条亚里士多德</span><span>12个双视角主题</span></div>
    </header>

    <section class="search-card">
      <input id="searchInput" placeholder="搜“潜龙勿用”“友谊”“什么时候行动”">
      <button id="clearBtn" type="button">清空</button>
    </section>

    <nav class="tabs" aria-label="主导航">
      <button data-view="home" class="active">首页</button>
      <button data-view="yijing">周易</button>
      <button data-view="aristotle">亚里士多德</button>
      <button data-view="topics">两种答案</button>
    </nav>

    <section id="searchResults" class="panel hidden"></section>
    <section id="content" class="panel"></section>

    <footer>
      <div>这是微信小程序 V1 的 H5 远程镜像，用于手机查看当前成品状态。</div>
      <div>源码真相源：<code>mina426w-ux/classical-wisdom-miniapp@a6bc9439306b</code></div>
      <div>不提供算命、投资、医疗或个体化决策结论。</div>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <button id="modalClose" class="modal-close">关闭</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
